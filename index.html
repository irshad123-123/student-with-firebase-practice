<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <div class="container">
        <div class="row mt-5">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header"><h2>Student Details</h2></div>
                    <div class="card-body">
                        <form id="studentForm">
                            <div class="form-group">
                                <input type="text" id="fname" placeholder="First Name" class="form-control">
                            </div>
                            <div class="form-group">
                                <input type="text" id="lname" placeholder="Last Name" class="form-control">
                            </div>
                            <div class="form-group">
                                <input type="email" id="email" placeholder="Email" class="form-control">
                            </div>
                            <div class="form-group">
                                <input type="number" id="contact" placeholder="Contact" class="form-control">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2 my-4">
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Sr.No</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Contact</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody id="studentContainer">
                            <tr>
                                <td>1</td>
                                <td>Irshad</td>
                                <td>Shaikh</td>
                                <td>irshad@gmail.com</td>
                                <td>8766737322</td>
                                <td><i class="fa-solid fa-user-pen fa-2x text-success" role="button"></i></td>
                                <td><i class="fa-solid fa-trash fa-2x text-danger" role="button"></i></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="./assets/js/app.js"></script>
</body>

</html>
